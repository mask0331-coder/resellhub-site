<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resell Hub — 새 주소로 이동합니다</title>
<link rel="canonical" href="https://resell-hub.pages.dev/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://resell-hub.pages.dev/">
<script>
  // 옛 주소(/resellhub-site/…)의 나머지 경로·쿼리·해시를 새 주소에 그대로 붙여 이동한다.
  var rest = location.pathname.replace(/^\/resellhub-site\/?/, "");
  location.replace("https://resell-hub.pages.dev/" + rest + location.search + location.hash);
</script>
<style>body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#fff;color:#1e2329}</style>
</head>
